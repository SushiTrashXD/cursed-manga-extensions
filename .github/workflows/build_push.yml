name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and republish every extension instead of only what changed since the last successful run
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 2
  IS_PR_CHECK: false

jobs:
  prepare:
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      latestCommitMessage: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
      full_rebuild: ${{ steps.base.outputs.full_rebuild || steps.generate-matrices.outputs.full_rebuild }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set env
        id: set-env
        run: |
          echo "LATEST_COMMIT_MESSAGE<<{delimiter}
          $(git log -1 --pretty=%B)
          {delimiter}" >> $GITHUB_OUTPUT

      - id: base
        name: Get last successful CI commit
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          # Empty tree: every module is diffed as new, so everything gets rebuilt
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$FULL_REBUILD" = "true" ]; then
            sha=$empty_tree
          else
            sha=$(python ./.github/scripts/find-base-sha.py build_push.yml)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$empty_tree" ]; then
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - id: generate-matrices
        name: Create output matrices
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          python ./.github/scripts/generate-build-matrices.py "$BASE_SHA"

  build:
    name: Populate Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Build and lint shared modules
        run: |
          MODULES=(":core")
          for dir in lib lib-multisrc; do
            for build_file in "$dir"/*/build.gradle.kts; do
              MODULES+=(":${dir}:$(basename "$(dirname "$build_file")")")
            done
          done

          # One extension, so that what only extension builds need is cached too
          extension=$(find src -mindepth 2 -maxdepth 2 -type d | sort | head -n 1)
          MODULES+=(":${extension//\//:}")

          TASKS=()
          for module in "${MODULES[@]}"; do
            TASKS+=("${module}:assembleDebug" "${module}:lintDebug")
          done
          ./gradlew "${TASKS[@]}"

  build-extensions:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
        run: |
          TASKS=()
          for module in $MODULES; do
            TASKS+=("${module}:assembleDebug")
          done
          ./gradlew "${TASKS[@]}"

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/jar/debug/*.jar
            **/build/keiyoushi-source-info.json
          retention-days: 1
          
